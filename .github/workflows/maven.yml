name: Automation Test Workflow

on:
  schedule:
  - cron: 00 18 * * * 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Running Automation Test Framework with Maven
      run: mvn test -Dbrowser=chrome -DisHeadless=true
      
    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v5.0.0 
      with:
       name: Test Logs
       path: logs/

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5.0.0 
      with:
       name: screenshots
       path: screenshots/  

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v5.0.0 
      with:
       name: Test Reports
       path: report.html     

    - name: Test Execution Status
      run: echo "Test Execution Completed"

    - name: Copy page to gh-pages Folder
      if: always()
      
      run: |
         mkdir -p public/extent-reports/
         mkdir -p public/extent-reports/screenshots/
         cp report.html public/extent-reports/
         if [ -d screenshots ]; then cp -R screenshots/* public/extent-reports/screenshots/; fi
         ls -l public/extent-reports/

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
          folder: public/extent-reports/
          token: ${{secrets.PAT1234}}
          clean: true  

      
    
    
      

